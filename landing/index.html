async function bot(lines, myRun) {

/* عجلة اختيار الأرقام */
function wheel(min, max, value, unit) {
  const box = el(`<div class="wheel"><div class="wheel-list" tabindex="0"></div><div class="unit">${unit}</div></div>`);
  const list = box.firstElementChild;
  const H = () => list.firstElementChild.offsetHeight || 44;
  let html = '<div class="pad"></div>';
  for (let v = min; v <= max; v++) html += `<div class="it" data-v="${v}">${v}</div>`;
  list.innerHTML = html + '<div class="pad"></div>';
  const items = [...list.querySelectorAll(".it")];
  const get = () => Math.max(min, Math.min(max, min + Math.round(list.scrollTop / H())));
  const mark = () => { const v = get(); items.forEach(i => i.classList.toggle("on", +i.dataset.v === v)); };
  const set = (v, smooth) => list.scrollTo({ top: (v - min) * H(), behavior: smooth ? "smooth" : "auto" });
  list.addEventListener("scroll", mark, { passive: true });
  list.addEventListener("click", e => { const it = e.target.closest(".it"); if (it) set(+it.dataset.v, true); });
  list.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") { e.preventDefault(); set(get() - 1, true); }
    if (e.key === "ArrowDown") { e.preventDefault(); set(get() + 1, true); }
  });
  requestAnimationFrame(() => { set(value); mark(); });
  box.get = get;
  return box;
}

function summary(sep) {

/* ================= الحسابات ================= */
function body() {
  const h = state.height / 100, bmi = state.weight / (h * h);
  const min = Math.round(18.5 * h * h), max = Math.round(24.9 * h * h);
  let cat = "وزن صحي";
  if (bmi < 18.5) cat = "نحافة"; else if (bmi >= 30) cat = "سمنة"; else if (bmi >= 25) cat = "وزن زائد";
  return { bmi: bmi.toFixed(1), min, max, cat, over: state.weight - max, under: min - state.weight };
}

/* ================= الخطوات ================= */
function buildSteps(key) {
  const g = GOALS[key], s = [];
  g.pre.forEach(q => s.push({ kind: "question", ...q }));
  if (g.female) state.gender = "female"; else s.push({ kind: "gender" });
  s.push({ kind: "hw" }, { kind: "phone" }, { kind: "age" });
  g.post.forEach(q => s.push({ kind: "question", ...q }));
  s.push({ kind: "notes" }, { kind: "result" });
  return s;
}

async function start() {
  run++; const myRun = run;
  state = newState(); chat.innerHTML = ""; clearPanel();
  $("#restart").style.display = "none";
  const pre = new URLSearchParams(location.search).get("goal");
  await bot(["أهلا بكم 👋", "أنظمة غذائية علاجية، بإشراف فريق طبي دولي", "10 سنوات خبرة مع ثقة أكثر من 43 ألف مشترك"], myRun);
  if (myRun !== run) return;
  if (pre && GOALS[pre]) return chooseGoal(pre, myRun);
  await bot(["وش هدفك أو الحالة اللي تبي نساعدك فيها؟"], myRun);
  if (myRun !== run) return;
  const wrap = el(`<div><p class="panel-title">اختر هدفك</p><div class="goals"></div></div>`);
  Object.entries(GOALS).forEach(([k, g]) => {
    const b = el(`<button class="goal" type="button"><span class="ic">${g.icon}</span>${esc(g.label)}</button>`);
    b.onclick = () => chooseGoal(k, myRun);
    wrap.lastElementChild.append(b);
  });
  panel.append(wrap);
}

async function chooseGoal(key, myRun) {
  state.goal = key; clearPanel();
  $("#restart").style.display = "block";
  const g = GOALS[key];
  user(`${g.icon} ${g.label}`);
  await bot(g.intro, myRun);
  steps = buildSteps(key);
  next(0, myRun);
}

async function next(i, myRun) {
  if (myRun !== run) return;
  clearPanel();
  const s = steps[i], go = () => next(i + 1, myRun);
  const g = GOALS[state.goal];
  const f = g.female;

  if (s.kind === "question") {
    await bot([s.q], myRun); if (myRun !== run) return;
    const box = el(`<div class="options${s.multi ? " chips" : ""}"></div>`);
    const picked = new Set();
    s.options.forEach(o => {
      const b = el(`<button class="opt" type="button">${esc(o)}</button>`);
      b.onclick = () => {
        if (!s.multi) return done(o);
        picked.has(o) ? picked.delete(o) : picked.add(o);
        b.classList.toggle("on"); cont.disabled = !picked.size;
      };
      box.append(b);
    });
    const cont = el(`<button class="btn" type="button" disabled>استمرار</button>`);
    cont.onclick = () => done([...picked].join("، "));
    panel.append(box); if (s.multi) panel.append(cont);
    function done(a) {
      state.answers.push({ key: s.key, q: s.q, a });
      user(a); syncLead(); go();
    }
  }

  else if (s.kind === "gender") {
    await bot(["عرفنا عن جنسك!"], myRun); if (myRun !== run) return;
    const box = el(`<div class="gender">
      <button class="opt" type="button" data-g="female"><span>👩</span>امرأة</button>
      <button class="opt" type="button" data-g="male"><span>👨</span>رجل</button></div>`);
    box.onclick = e => {
      const b = e.target.closest("[data-g]"); if (!b) return;
      state.gender = b.dataset.g; state.height = state.gender === "male" ? 172 : 160;
      state.weight = state.gender === "male" ? 80 : 68;
      user(b.textContent.trim()); go();
    };
    panel.append(box);
  }

  else if (s.kind === "hw") {
    await bot([f ? "أدخلي طولك ووزنك" : "أدخل طولك ووزنك"], myRun); if (myRun !== run) return;
    const hW = wheel(120, 220, state.height, "Cm"), wW = wheel(35, 200, state.weight, "Kg");
    const box = el(`<div class="wheels"><div class="wheel-box"><span class="lbl">الطول</span></div><div class="wheel-box"><span class="lbl">الوزن</span></div></div>`);
    box.children[0].append(hW); box.children[1].append(wW);
    const btn = el(`<button class="btn" type="button">استمرار</button>`);
    btn.onclick = async () => {
      state.height = hW.get(); state.weight = wW.get();
      user(`الوزن ${state.weight} ، الطول ${state.height}`);
      clearPanel();
      const b = body();
      let msg;
      if (g.noWeightGoal) msg = "تمام، سجلنا طولك ووزنك 👍";
      else if (b.over > 0) msg = `وزنك أعلى من الوزن المثالي بحوالي ${b.over} كيلو`;
      else if (b.under > 0) msg = `وزنك أقل من الوزن المثالي بحوالي ${b.under} كيلو`;
      else msg = "وزنك ضمن الوزن الصحي 👌";
      await bot([msg], myRun); go();
    };
    panel.append(box, btn);
  }

  else if (s.kind === "phone") {
    await bot(["لمعرفة خطتك بالتفصيل،", `${f ? "اتركي" : "اترك"} رقم واتسابك ✉️ وبتتواصل معك ${g.specialist} مباشرة`], myRun);
    if (myRun !== run) return;
    const opts = Object.entries(COUNTRIES).map(([k, c]) =>
      `<option value="${k}"${k === state.country ? " selected" : ""}>${c.flag} +${c.code}</option>`).join("");
    const box = el(`<div>
      <div class="phone-row"><select aria-label="رمز الدولة">${opts}</select>
      <input type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="رقم الواتس اب" aria-label="رقم الواتس اب"></div>
      <div class="err"></div>
      <button class="btn" type="button">إرسال واستلام الخطة</button>
      <div class="hint">🔒 رقمك سري ويُستخدم فقط لتواصل الأخصائية معك</div></div>`);
    const sel = $("select", box), inp = $("input", box), err = $(".err", box), btn = $(".btn", box);
    const clean = v => v.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g, "");
    const submit = () => {
      const c = COUNTRIES[sel.value];
      let n = clean(inp.value);
      if (n.startsWith("00" + c.code)) n = n.slice(2 + c.code.length);
      else if (n.startsWith(c.code) && n.length > Math.max(...c.len)) n = n.slice(c.code.length);
      n = n.replace(/^0+/, "");
      if (!c.len.includes(n.length) || (c.start && !n.startsWith(c.start))) {
        err.textContent = `الرقم غير صحيح، تأكد أنه ${c.len[0]} أرقام${c.start ? ` ويبدأ بـ ${c.start}` : ""}`;
        inp.focus(); return;
      }
      state.country = sel.value; state.phone = n;
      user(`+${c.code} ${n}`);
      createLead(); go();
    };
    btn.onclick = submit;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    inp.addEventListener("input", () => err.textContent = "");
    panel.append(box);
    setTimeout(() => inp.focus(), 50);
  }

  else if (s.kind === "age") {
    await bot(["تم استلام رقمك ✅", "كم عمرك؟"], myRun); if (myRun !== run) return;
    const w = wheel(12, 90, state.age, "سنة");
    const box = el(`<div class="wheels"><div class="wheel-box"><span class="lbl">عمرك</span></div></div>`);
    box.firstElementChild.append(w);
    const btn = el(`<button class="btn" type="button">استمرار</button>`);
    btn.onclick = () => { state.age = w.get(); user(String(state.age)); syncLead(); go(); };
    panel.append(box, btn);
  }

  else if (s.kind === "notes") {
    await bot([`في شي ثاني حاب${f ? "ة" : ""} تضيفه للأخصائية؟`, "مثلاً: أدوية، حساسية من أكل، أكلات ما تحبها"], myRun);
    if (myRun !== run) return;
    const box = el(`<div><textarea placeholder="اكتب ملاحظاتك هنا..." maxlength="500"></textarea>
      <button class="btn" type="button">إرسال</button><button class="btn link" type="button">ما عندي، تخطي</button></div>`);
    const ta = $("textarea", box);
    const [send, skip] = box.querySelectorAll("button");
    send.onclick = () => {
      const v = ta.value.trim(); if (!v) return ta.focus();
      state.notes = v; user(v); syncLead(); go();
    };
    skip.onclick = () => { user("ما عندي"); go(); };
    panel.append(box);
  }

  else if (s.kind === "result") {
    await bot([`شكراً لإرسال المعلومات 🌷`, `ستتواصل معك قريباً ${g.specialist}`], myRun);
    if (myRun === run) renderResult();
  }
}

  const d = new Date(), end = new Date(d); end.setMonth(d.getMonth() + 3);
  const fmt = x => x.toLocaleDateString("ar", { day: "numeric", month: "long" });
  return `

    <p style="font-size:14px;color:var(--muted)">توقع تقريبي مبني على بياناتك، والنتيجة تختلف حسب الالتزام.</p>

      <line x1="${X[0]}" y1="${y(w)}" x2="${X[1]}" y2="${y(w)}" stroke="#e3eaf3" stroke-dasharray="4 4"/>
      <path d="M${X[0]},${y(w)} C120,${y(w)} 200,${y(without)} ${X[1]},${y(without)}" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <path d="M${X[0]},${y(w)} C120,${y(w)} 200,${y(target)} ${X[1]},${y(target)}" fill="none" stroke="#0a8cff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="${X[0]}" cy="${y(w)}" r="5" fill="#064576"/>
      <circle cx="${X[1]}" cy="${y(without)}" r="5" fill="#f43f5e"/>
      <circle cx="${X[1]}" cy="${y(target)}" r="6" fill="#0a8cff"/>
      <text x="${X[0]}" y="${y(w) - 10}" font-size="12" font-weight="700" text-anchor="middle" fill="#064576">${w} كجم</text>
      <text x="${X[1]}" y="${y(without) - 10}" font-size="12" font-weight="700" text-anchor="middle" fill="#f43f5e">${without} كجم</text>
      <text x="${X[1]}" y="${y(target) + 20}" font-size="13" font-weight="800" text-anchor="middle" fill="#0a8cff">${target} كجم</text>
      <text x="${X[0]}" y="165" font-size="11" text-anchor="middle" fill="#7a8797">اليوم</text>
      <text x="${X[1]}" y="165" font-size="11" text-anchor="middle" fill="#7a8797">${fmt(end)}</text>
    </svg>
    <div class="legend"><span><i style="background:#0a8cff"></i>مع البرنامج</span><span><i style="background:#f43f5e"></i>بدون خطة</span></div>
  </div>`;
}

async function renderResult() {
  clearPanel();
  const g = GOALS[state.goal], r = g.result, b = body();
  const link = await waLink();
  const showBody = !g.noWeightGoal;
  const wrap = el(`<div class="result">
    <a class="wa-btn" target="_blank" rel="noopener" href="${esc(link)}">💬 تحدث مع الأخصائية الآن</a>
    <div class="card">
      <h3>${g.icon} ${esc(r.title)}</h3>
      ${showBody ? `<div class="stats">
        <div class="stat"><b>${b.bmi}</b><small>مؤشر الكتلة</small></div>
        <div class="stat"><b>${b.cat}</b><small>التصنيف</small></div>
        <div class="stat"><b>${b.min}-${b.max}</b><small>الوزن المثالي (كجم)</small></div></div>` : ""}
      <ul class="points">${r.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    </div>
    ${showBody && b.over > 0 ? chart(b) : ""}
    ${r.note ? `<div class="note">⚠️ ${esc(r.note)}</div>` : ""}
    <div class="card" id="fb" style="display:none"><h3>نتائج مشتركينا</h3><div class="gallery"></div></div>
    <a class="wa-btn" target="_blank" rel="noopener" href="${esc(link)}">ابدأ الآن عبر واتساب</a>
  </div>`);
  chat.append(wrap);
  const gal = $(".gallery", wrap), fb = $("#fb", wrap);
  for (let i = 1; i <= 7; i++) {
    const img = new Image();
    img.loading = "lazy"; img.alt = "";
    img.onload = () => { fb.style.display = ""; };
    img.onerror = () => img.remove();
    img.src = `${CONFIG.FEEDBACK_BASE}${encodeURIComponent(g.folder)}/${String(i).padStart(2, "0")}.webp`;
    gal.append(img);
  }
  scrollDown();
}

$("#restart").onclick = start;
loadExpertNumbers();
logVisit();
start();
