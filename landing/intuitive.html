.ov .big{font-size:60px}.ov h3{margin:6px 0;font-size:21px}.ov p{color:var(--muted);line-height:1.7;margin:0 0 16px}

.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.kp div{background:#f4f6fb;border-radius:14px;padding:10px 4px;text-align:center}.kp b{display:block;font-size:20px;color:var(--g1)}.kp span{font-size:11px;color:var(--muted)}

</style>

 rashaqa:["سجّل وزنك مرة واحدة أسبوعياً فقط، والتركيز اليوم على الإشارات مو الميزان.","الأكل العاطفي أكبر سبب لتوقف نزول الوزن؛ تمارين هذا الأسبوع هي مفتاح كسر الثبات.","الحصص المسموحة من نظامك هي \"الحصة الآمنة\" للأطعمة المخيفة.","قِس محيط الخصر هذا الأسبوع وقارنه ببداية البرنامج."],

 dhaght:["الأكل البطيء يساعدك تحس بالملوحة؛ ذق قبل ما تضيف ملح.","التوتر يرفع الضغط والشهية معاً: تمارين التنفس اليوم لها فائدة مزدوجة.","انتبه للأطعمة المخيفة المالحة (مخللات، شيبس، أجبان مالحة): الحصة الآمنة أصغر.","سجّل قراءة ضغطك هذا الأسبوع وقارنها ببداية البرنامج."],

 if(t==="sat")rec=scale(k+"r","الرضا من الوجبة","1 لا شي • 10 رضا تام")+scale(k+"f","الامتلاء","الهدف 6–7");
 rec=scale(k+"a","كم طبّقت تمرين اليوم؟","1 ما طبقت • 10 طبقته تماماً")+rec;
 const ph={list:"1)\n2)\n3)",hs:"السبب: جوع / ملل / توتر / عادة…",sat:"وش لاحظت؟",note:"وش لاحظت اليوم؟"}[t];
 main.innerHTML=`
 <div class="card"><div class="hero"><div class="ico">${ICONS[DAY-1]}</div><div>
   <span class="chip">تمرين اليوم</span><h2>${x[0]}</h2>
   <div class="meta"><span>⏱ 5–10 دقائق</span><span>🎯 ${TRACKS[S.track]}</span></div></div></div></div>
 <div class="card"><div class="sec">كيف أنفّذ؟</div>${steps(x[1]).map((s,i)=>`<div class="step"><b>${i+1}</b><div>${s}</div></div>`).join("")}</div>
 ${x[2]?`<div class="tip gulf"><span class="e">🌴</span><div><b>من واقعنا</b><br>${x[2]}</div></div>`:""}
 <div class="tip trk"><span class="e">🩺</span><div><b>لنظامك (${TRACKS[S.track]})</b><br>${TT[S.track][w]}</div></div>
 <div class="card"><div class="sec">سجّل تجربتك</div>${rec}<textarea data-k="${k}" placeholder="${ph}">${S.notes[k]||""}</textarea></div>
 ${DAY===30?`<div class="card"><div class="sec">تقييم الشهر</div>${["وش تغيّر في علاقتك مع الأكل؟","صرت أوعى بإشارات الجوع والشبع؟","تحسّنت قراءاتك أو قياساتك؟","أكبر تحدي واجهته؟"].map((q,i)=>`<div class="lbl">${q}</div><textarea data-k="f${i}">${S.notes["f"+i]||""}</textarea>`).join("")}</div>`:""}
 <div class="card"><div class="lbl">نوع نظامك</div><div class="tracks">${Object.entries(TRACKS).map(([a,b])=>`<button data-t="${a}" class="${S.track===a?"on":""}">${b}</button>`).join("")}</div></div>`;
 btn.className=done?"done":"";btn.textContent=done?"✓ أنجزت تمرين اليوم":"أنجزت تمرين اليوم";
 lock.textContent=done?(DAY<30?"🔒 تمرين بكرة يفتح الساعة 12 بالليل":"🏆 خلصت البرنامج كامل!"):"";
}
function confetti(){for(let i=0;i<40;i++){const c=document.createElement("i");c.className="conf";c.style.left=Math.random()*100+"vw";c.style.background=COLORS()[i%10];c.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}
// ===== الربط مع السيرفر (لوحة الأدمن) =====
// التطبيق يفتح الصفحة هكذا: intuitive.html?token=USER_TOKEN&api=https://di3t-club.com/api
const API=P.get("api")||window.DI3T_API||"",TOKEN=P.get("token")||"";
const hdr={"Content-Type":"application/json","Accept":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})};
function payload(d){const k="d"+d,n=S.notes;return {day:d,track:S.track,done:!!S.done[d],commitment:n[k+"a"]||null,hunger:n[k+"h"]||null,fullness:n[k+"s"]||n[k+"f"]||null,satisfaction:n[k+"r"]||null,note:n[k]||"",final_answers:d===30?[0,1,2,3].map(i=>n["f"+i]||""):undefined,completed_at:new Date().toISOString()}}
function sync(d){if(!API)return;fetch(API+"/intuitive/progress",{method:"POST",headers:hdr,body:JSON.stringify(payload(d))}).catch(()=>{S.pending=[...new Set([...(S.pending||[]),d])];save()})}
async function pull(){if(!API)return;try{(S.pending||[]).forEach(sync);S.pending=[];
 const r=await fetch(API+"/intuitive/progress",{headers:hdr});if(!r.ok)return;const j=await r.json();
 if(j.start_date)S.start=new Date(j.start_date).setHours(0,0,0,0);if(j.track)S.track=j.track;
 (j.days||[]).forEach(x=>{const k="d"+x.day;S.done[x.day]=x.done;if(x.commitment)S.notes[k+"a"]=x.commitment;if(x.hunger)S.notes[k+"h"]=x.hunger;if(x.fullness)S.notes[k+(D[x.day-1][3]==="sat"?"f":"s")]=x.fullness;if(x.satisfaction)S.notes[k+"r"]=x.satisfaction;if(x.note)S.notes[k]=x.note});
 DAY=calcDay();save();render()}catch(e){}}
// ===== شاشة النتيجة للمشترك =====
function avg(a){a=a.filter(Boolean);return a.length?(a.reduce((x,y)=>x+y,0)/a.length):null}
function results(){const n=S.notes,days=[...Array(30)].map((_,i)=>i+1),done=days.filter(d=>S.done[d]).length;
 const wk=w=>days.slice(w*7,w===3?30:w*7+7),com=w=>avg(wk(w).map(d=>n["d"+d+"a"]));
 const ful=days.map(d=>n["d"+d+"s"]||n["d"+d+"f"]).filter(Boolean),hun=days.map(d=>n["d"+d+"h"]).filter(Boolean),sat=days.map(d=>n["d"+d+"r"]).filter(Boolean);
 const f=v=>v==null?"—":v.toFixed(1);const cur=Math.min(3,Math.floor((DAY-1)/7));
 const bars=days.map(d=>{const v=n["d"+d+"a"]||0;return `<rect x="${(30-d)*10+1}" y="${60-v*6}" width="8" height="${v*6}" rx="2" fill="${S.done[d]?"#6d4fd8":"#d9dceb"}"/>`}).join("");
 resB.innerHTML=`<div class="kp"><div><b>${done}/30</b><span>يوم منجز</span></div><div><b>${Math.round(done/Math.max(1,DAY)*100)}%</b><span>نسبة الالتزام</span></div><div><b>${f(avg(days.map(d=>n["d"+d+"a"])))}</b><span>متوسط التطبيق</span></div></div>
 <div class="lbl">التطبيق اليومي</div><svg viewBox="0 0 300 62" style="width:100%;background:#fafbfd;border-radius:12px">${bars}</svg>
 <div class="cmp"><span>التطبيق: الأسبوع 1 ← الأسبوع ${cur+1}</span><span>${f(com(0))} ← <b>${f(com(cur))}</b></span></div>
 <div class="cmp"><span>الشبع عند التوقف (الهدف 6–7)</span><span>${ful.length?f(ful[0])+" ← <b>"+f(ful[ful.length-1])+"</b>":"—"}</span></div>
 <div class="cmp"><span>الجوع قبل الأكل (الهدف 3–4)</span><span>${hun.length?f(hun[0])+" ← <b>"+f(hun[hun.length-1])+"</b>":"—"}</span></div>
 <div class="cmp"><span>متوسط الرضا من الأكل</span><span><b>${f(avg(sat))}</b></span></div>
 <p style="font-size:12.5px;margin-top:10px">💙 نتائجك تُرسل لأخصائيتك وتنعرض مع وزنك وقياساتك في ملفك.</p>`;res.classList.add("show")}
resBtn.onclick=results;
pull();
btn.onclick=()=>{if(S.done[DAY])return;S.done[DAY]=true;save();render();confetti();sync(DAY);if(DAY===30)return setTimeout(results,1500);
 ovT.textContent=DAY===30?"مبروك! خلصت 30 يوم":`أحسنت! يوم ${DAY} ✓`;
 ovP.textContent=DAY===30?"علاقتك مع الأكل صارت أهدأ وأوعى. كمّل على نفس الطريق.":`باقي ${30-DAY} يوم. نشوفك بكرة مع تمرين جديد 💙`;ov.classList.add("show")};
document.addEventListener("click",e=>{const s=e.target.closest("[data-s]"),t=e.target.closest("[data-t]");
 if(s){S.notes[s.dataset.s]=+s.dataset.v;save();render();if(S.done[DAY])sync(DAY)}
 if(t){S.track=t.dataset.t;save();render()}});
let tmr;document.addEventListener("input",e=>{if(e.target.dataset.k){S.notes[e.target.dataset.k]=e.target.value;save();if(S.done[DAY]){clearTimeout(tmr);tmr=setTimeout(()=>sync(DAY),1500)}}});
render();
</script>
