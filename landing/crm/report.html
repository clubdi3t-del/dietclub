  <svg class="fk" viewBox="0 0 300 54" preserveAspectRatio="none"><path d="M150 0 V14 Q150 26 225 30 Q300 34 300 54" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/><path d="M150 0 V14 Q150 26 75 30 Q0 34 0 54" fill="none" stroke="#f87171" stroke-width="4" stroke-dasharray="7 7" stroke-linecap="round"/></svg>
  <div class="paths">
   <div class="pa good"><div class="ph">✅ طريق العلاج</div><div class="pn">${esc(C.program)}</div>
    ${arr(C.how).map(s=>`<div class="st">➜ ${esc(s)}</div>`).join("")}
    <div class="pr">النتيجة:</div>${arr(C.result).map(s=>`<div class="ok2">✓ ${esc(s)}</div>`).join("")}</div>
   <div class="pa bad"><div class="ph">⚠️ بدون بداية</div><div class="pn">الأعراض تقوى مع الوقت</div>
    ${(arr(C.risks).length?arr(C.risks):["الأعراض غالباً تستمر أو تزيد",diff>0?"الوزن يميل للزيادة مع الوقت":"","تأثير على النوم والطاقة اليومية"].filter(Boolean)).map(s=>`<div class="no">✕ ${esc(s)}</div>`).join("")}</div></div>
  ${C.doctor!==false&&/حرق|ألم|سكر|ضغط|مستمر/.test((C.complaint||"")+arr(C.symptoms).join(""))?`<div class="warn">⚕️ الأعراض المستمرة تحتاج مراجعة الطبيب، وأي دواء يكون منه.</div>`:""}</div>

 ${diff>0?`<div class="card res"><h2><i>🎯</i>رحلة وزنك</h2>
  <div class="wg"><div><b>${C.weight}</b><small>وزنك الحين</small></div><div class="ar"></div><div><b style="color:#4ade80">${target}</b><small>هدفك</small></div></div>
  <div class="tl">
   <div><b>بعد أسبوعين</b><p>حوالي <b>-${step(2)} كغ</b> • تبدأ تحس بالفرق</p></div>
   <div><b>بعد شهر</b><p>حوالي <b>-${step(4.3)} كغ</b> • طاقة أعلى وأكل منتظم</p></div>
   <div><b>بعد 3 أشهر</b><p>حوالي <b>-${step(13)} كغ</b> • عادة ثابتة تكمل معك</p></div></div>
  <small style="color:#93b4dc;display:block;margin-top:10px">* أرقام تقريبية وتختلف حسب الالتزام والحالة الصحية.</small></div>`:""}

 <div class="card" id="pay"><h2><i>💳</i>اشترك وابدأ برنامجك</h2>
  <div class="plans">${plans.map(k=>`<button class="pl ${SEL===k?"on":""}" data-pl="${k}">${k==="6"?'<em>الأنسب لحالتك</em>':""}<b>${PL[k].t}</b><small>${PL[k].d||"&nbsp;"}</small>${PR[k]?`<span>${PR[k]}$${cur?` ≈ ${(PR[k]*cur[1]).toLocaleString("en",{maximumFractionDigits:cur[1]<1?2:0})} ${esc(cur[0])}`:""}</span>`:""}</button>`).join("")}</div>
  <table class="ft"><tr><th></th>${plans.map(k=>`<th class="${SEL===k?"on":""}">${PL[k].t}</th>`).join("")}</tr>
   ${FT.map(([f,min])=>`<tr><td>${f}</td>${plans.map(k=>`<td class="${SEL===k?"on":""}">${has(k,min)?'<i class="y">✓</i>':'<i class="n">✕</i>'}</td>`).join("")}</tr>`).join("")}</table>
  ${arr(C.gifts).length?`<div class="gift">🎁 <b>هدايا خاصة لك:</b> ${arr(C.gifts).map(esc).join(" • ")}</div>`:""}
  <div class="sub">اختر طريقة الدفع</div>${ms||'<div class="warn">تواصل معنا لطريقة الدفع المناسبة لبلدك</div>'}
  <div class="agent">🔒 الحسابات المحلية تابعة لوكلائنا المعتمدين لتسهيل الدفع في بلدك.</div>
  ${CFG.whatsapp?`<a class="btn g" href="https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent("السلام عليكم، أنا "+C.name+" حوّلت مبلغ اشتراك "+PL[SEL].t+"، وهذا الإيصال 👇")}" target="_blank">📎 أرسل إيصال الدفع على واتساب</a>`:""}</div>
 <div class="card"><h2><i>🗓️</i>وش يصير بعد الدفع؟</h2>
  <div class="steps"><div><b>1</b><p>أخصائية التغذية تراجع معلوماتك كاملة</p></div><div><b>2</b><p>الدكتور الاستشاري يعتمد برنامجك</p></div><div><b>3</b><p>أخصائية المتابعة تتواصل معك بنفس الوقت</p></div><div><b>4</b><p>برنامجك يوصلك خلال <b>24 ساعة</b></p></div></div>
  <small class="fri">* الطلبات يوم الجمعة نتواصل معك فيها يوم السبت.</small>
  <div class="gua">🛡️ <div><b>ضمان النتيجة</b>إذا التزمت بالبرنامج بشكل كامل وما شفت نتيجة، نرجع لك مبلغ الاشتراك.</div></div></div>
 <details class="card" id="more"><summary class="msum"><span><i>✍️</i>كمّل بياناتك <small>(اختياري – يسرّع تجهيز برنامجك)</small></span><em>⌄</em></summary>
  <label>هدفك الأساسي</label><div class="opts" data-q="goal">${["نزول وزن","راحة المعدة","تنظيم السكر","زيادة وزن","صحة عامة"].map(o=>`<button>${o}</button>`).join("")}</div>
  <label>أمراض أو أدوية حالية</label><input id="q_med" placeholder="مثلاً: لا يوجد / ضغط / أدوية المعدة">
  <label>حساسية أو أكلات ما تحبها</label><input id="q_all" placeholder="مثلاً: السمك، الحليب">
  <label>كم وجبة تاكل باليوم؟</label><div class="opts" data-q="meals">${["1 أو 2","3","4 أو أكثر"].map(o=>`<button>${o}</button>`).join("")}</div>
  <label>نشاطك اليومي</label><div class="opts" data-q="act">${["قليل","متوسط","عالي"].map(o=>`<button>${o}</button>`).join("")}</div>
  <label>وقت النوم والاستيقاظ</label><input id="q_sleep" placeholder="مثلاً: أنام 1 بالليل وأصحى 8">
  <label>شي تحب تضيفه</label><textarea id="q_note" rows="2"></textarea>
  <button class="btn o" id="send">إرسال البيانات للأخصائية</button><div class="ok" id="sent">✓ وصلت بياناتك، شكراً لك</div></details>


 <div class="card faq"><h2><i>❓</i>أسئلة شائعة</h2>
  <details><summary>هل البرنامج من أكلنا وأكل البيت؟</summary><p>نعم، يُبنى على أكلك المعتاد وثقافة بلدك، مع إمكانية استبدال الوجبات.</p></details>
  <details><summary>مين يجهز البرنامج؟</summary><p>أخصائية تغذية علاجية، ويعتمده دكتور استشاري بعد مراجعة معلوماتك كاملة.</p></details>
  <details><summary>عندي حالة صحية أو آخذ أدوية، يناسبني؟</summary><p>نعم، البروتوكول يُعدّ حسب حالتك. وأي دواء يبقى حسب طبيبك المعالج.</p></details>
  <details><summary>وش لو ما ناسبني شي في البرنامج؟</summary><p>تتواصل مع أخصائيتك ويتعدل البرنامج خلال المتابعة.</p></details></div>`;
}
let SEL=null;render();
// شريط هادئ يظهر بعد ما يقرأ العميل حالته، ويختفي عند قسم الاشتراك
addEventListener("scroll",()=>{const pay=$("#pay"),fk=document.querySelector(".fork");if(!pay||!fk)return;const show=fk.getBoundingClientRect().bottom<0&&pay.getBoundingClientRect().top>innerHeight*0.6&&pay.getBoundingClientRect().bottom>0;$("#stick").classList.toggle("on",show&&pay.getBoundingClientRect().top>0)},{passive:true});
// ===== تتبع: يوصل للأخصائية ثم يحول على رابط الدفع =====
function track(ev,extra){const body=JSON.stringify({event:ev,lead:C.id||null,name:C.name,phone:C.phone,country:C.country,plan:SEL,at:new Date().toISOString(),...extra});
 if(!CFG.track)return;try{navigator.sendBeacon?navigator.sendBeacon(CFG.track,new Blob([body],{type:"text/plain"})):fetch(CFG.track,{method:"POST",body,keepalive:true})}catch(e){}}
track("report_opened");
function goPay(k){const pr=PR[SEL],base=(CFG.links||{})[k];if(!base){toast("رابط الدفع غير متوفر حالياً، تواصل معنا");return}
 const url=pr?base.replace("{usd}",pr):base.replace(/[?&][^=]+=\{usd\}/,"");track("pay_clicked",{method:k,url});toast("جاري تحويلك لصفحة الدفع…");setTimeout(()=>location.href=url,400)}
document.addEventListener("click",e=>{const py=e.target.closest("[data-pay]");if(py){goPay(py.dataset.pay);return}const pl=e.target.closest("[data-pl]");if(pl){SEL=pl.dataset.pl;const y=scrollY;render();scrollTo(0,y);return}const c=e.target.closest("[data-c]");if(c){navigator.clipboard?.writeText(c.dataset.c);toast("تم النسخ ✓")}
 const o=e.target.closest(".opts button");if(o){o.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===o))}});
$("#send").onclick=()=>{const v=q=>document.querySelector(`[data-q="${q}"] .on`)?.textContent||"—",g=id=>$("#"+id).value||"—";
 const msg=`بيانات إضافية من ${C.name} (${C.phone||""}):\n• الهدف: ${v("goal")}\n• أمراض/أدوية: ${g("q_med")}\n• حساسية: ${g("q_all")}\n• الوجبات: ${v("meals")}\n• النشاط: ${v("act")}\n• النوم: ${g("q_sleep")}\n• ملاحظة: ${g("q_note")}`;
 if(CFG.api)fetch(CFG.api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lead:C.id,phone:C.phone,answers:msg})}).catch(()=>{});
 if(CFG.whatsapp)open(`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(msg)}`,"_blank");
 $("#sent").style.display="block";toast("تم ✓")};
</script>
</body>
</html>
